<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Closeout — Know your exit. Before you sign.</title>
  <desc id="description">A warm-white and violet Closeout banner with the exit-arrow mark and an illustrative order book.</desc>
  <rect x="1" y="1" width="1278" height="338" rx="20" fill="#fbfaf9" stroke="#dfdce4" stroke-width="2"/>
  <g transform="translate(52 40) scale(.64)" stroke="#6f4cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 14H23a9 9 0 0 0-9 9v18a9 9 0 0 0 9 9h13"/>
    <path d="M31 32h21m-9-9 9 9-9 9"/>
  </g>
  <text x="104" y="72" fill="#0a0a0a" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="-2">closeout<tspan fill="#6f4cff">.</tspan></text>
  <text x="56" y="158" fill="#0a0a0a" font-family="Georgia, Times New Roman, serif" font-size="57" letter-spacing="-2">Know your exit.</text>
  <text x="56" y="222" fill="#6f4cff" font-family="Georgia, Times New Roman, serif" font-size="57" font-style="italic" letter-spacing="-2">Before you sign.</text>
  <text x="58" y="284" fill="#68646f" font-family="Arial, Helvetica, sans-serif" font-size="17">See what could sell, what fees take, and what stays yours.</text>
  <rect x="831" y="42" width="392" height="256" rx="15" fill="#fff" stroke="#dfdce4"/>
  <text x="855" y="79" fill="#68646f" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">THE EXIT, IN FOCUS</text>
  <circle cx="1192" cy="74" r="4" fill="#6f4cff"/>
  <path d="M831 97H1223" stroke="#dfdce4"/>
  <g fill="#6f4cff">
    <rect x="904" y="119" width="86" height="12" rx="2"/>
    <rect x="904" y="146" width="129" height="12" rx="2"/>
    <rect x="904" y="173" width="186" height="12" rx="2"/>
  </g>
  <rect x="904" y="200" width="258" height="12" rx="2" fill="#dfdce4"/>
  <g fill="#6f4cff" font-family="monospace" font-size="12">
    <text x="854" y="129">0.62</text>
    <text x="854" y="156">0.61</text>
    <text x="854" y="183">0.60</text>
  </g>
  <text x="854" y="210" fill="#68646f" font-family="monospace" font-size="12">0.58</text>
  <path d="M831 235H1223" stroke="#dfdce4"/>
  <text x="855" y="274" fill="#0a0a0a" font-family="Arial, Helvetica, sans-serif" font-size="14">Your position. Your floor. A clearer plan.</text>
</svg>
